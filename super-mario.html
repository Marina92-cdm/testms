<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Super Mario — gra platformowa</title><style>body{margin:0;background:#172033;color:white;font:16px system-ui;text-align:center}main{max-width:900px;margin:25px auto;padding:12px}canvas{width:100%;background:#8bd4ff;border-radius:12px;image-rendering:pixelated}button{font:inherit;padding:12px 22px;border:0;border-radius:9px;cursor:pointer;margin:5px;background:#facc15;color:#222}.controls{display:flex;justify-content:center;gap:15px}.controls button{min-width:75px;touch-action:none}p{line-height:1.5}</style></head><body><main><h1>🍄 Super Mario — przygoda</h1><p id="hud">🪙 Monety: 0　❤️ Życia: 3　🏁 Poziom: 1</p><canvas id="game" width="800" height="420" tabindex="0" aria-label="Gra platformowa"></canvas><div><button id="start">▶ Start / Nowa gra</button><button id="pause">⏸ Pauza</button></div><div class="controls"><button data-key="left">◀</button><button data-key="jump">⬆ SKOK</button><button data-key="right">▶</button></div><p>Strzałki lub A/D — ruch • Spacja, W lub ↑ — skok.<br>Skacz na przeciwników, zbieraj monety i dotrzyj do flagi!</p><p id="status" aria-live="polite">Kliknij Start, aby rozpocząć.</p></main><script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),hud=document.getElementById('hud'),status=document.getElementById('status');const W=800,H=420,G=375,L=2600;let player,platforms,coins,enemies,keys={},lives=3,score=0,level=1,camera=0,active=false,paused=false,inv=0,last=0,raf=0;
function setup(){player={x:35,y:G-34,w:25,h:34,vx:0,vy:0,on:true};platforms=[260,570,920,1280,1660,2050].map((x,i)=>({x,y:300-(i%2)*45,w:145,h:18}));coins=[];for(let x=120;x<L-100;x+=110)coins.push({x,y:G-50,got:false});for(const p of platforms)for(let x=p.x+25;x<p.x+p.w;x+=45)coins.push({x,y:p.y-28,got:false});enemies=[430,790,1100,1500,1850,2260].map((x,i)=>({x,y:G-24,w:28,h:24,vx:i%2?1.1:-1.1,alive:true}));camera=0;inv=80;updateHUD()}
function updateHUD(){hud.textContent=`🪙 Monety: ${score}　❤️ Życia: ${lives}　🏁 Poziom: ${level}`}
function start(){cancelAnimationFrame(raf);lives=3;score=0;level=1;setup();active=true;paused=false;last=0;status.textContent='Powodzenia!';canvas.focus();raf=requestAnimationFrame(frame)}
function finish(win){active=false;status.textContent=win?`🏆 Brawo! Ukończono poziom. Monety: ${score}.`:`💔 Koniec gry. Monety: ${score}.`;draw()}
function hurt(){if(inv>0)return;lives--;updateHUD();if(lives<=0){finish(false);return}player.x=Math.max(35,player.x-130);player.y=G-100;player.vy=-3;inv=100}
function step(dt){let d=Math.min(dt,2);player.vx=keys.left?-3.8:keys.right?3.8:0;if(keys.jump&&player.on){player.vy=-11.8;player.on=false}const bottom=player.y+player.h;player.vy=Math.min(13,player.vy+.55*d);player.x=Math.max(0,Math.min(L-player.w,player.x+player.vx*d));player.y+=player.vy*d;player.on=false;if(player.y+player.h>=G){player.y=G-player.h;player.vy=0;player.on=true}for(const p of platforms)if(player.vy>=0&&bottom<=p.y+5&&player.y+player.h>=p.y&&player.x+player.w>p.x&&player.x<p.x+p.w){player.y=p.y-player.h;player.vy=0;player.on=true}for(const coin of coins)if(!coin.got&&Math.abs(player.x+12-coin.x)<19&&Math.abs(player.y+16-coin.y)<24){coin.got=true;score++;updateHUD()}for(const e of enemies){if(!e.alive)continue;e.x+=e.vx*d;if(e.x<40||e.x>L-70)e.vx*=-1;if(player.x+player.w>e.x&&player.x<e.x+e.w&&player.y+player.h>e.y&&player.y<e.y+e.h){if(player.vy>1&&bottom<e.y+12){e.alive=false;player.vy=-8}else hurt()}}inv=Math.max(0,inv-d);camera=Math.max(0,Math.min(L-W,player.x-250));if(player.x>L-105)finish(true)}
function draw(){ctx.fillStyle='#8bd4ff';ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(-camera*.2,0);for(let x=80;x<L;x+=340){ctx.fillStyle='#fff';for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(x+i*25,70-(i%2)*10,25,0,7);ctx.fill()}}ctx.restore();ctx.save();ctx.translate(-camera,0);ctx.fillStyle='#73bf57';for(let x=0;x<L;x+=210){ctx.beginPath();ctx.arc(x+70,G,90,Math.PI,0);ctx.fill()}ctx.fillStyle='#945a30';ctx.fillRect(0,G,L,H-G);ctx.fillStyle='#4caf50';ctx.fillRect(0,G,L,9);for(let x=0;x<L;x+=35){ctx.strokeStyle='#b77945';ctx.strokeRect(x,G+10,35,35)}for(const p of platforms){ctx.fillStyle='#ae6738';ctx.fillRect(p.x,p.y,p.w,p.h);ctx.fillStyle='#e9aa56';ctx.fillRect(p.x,p.y,p.w,6)}for(const coin of coins)if(!coin.got){ctx.fillStyle='#ffd21c';ctx.beginPath();ctx.ellipse(coin.x,coin.y,9,13,0,0,7);ctx.fill();ctx.strokeStyle='#a66a00';ctx.stroke()}for(const e of enemies)if(e.alive){ctx.fillStyle='#a44c2c';ctx.beginPath();ctx.arc(e.x+14,e.y+13,14,Math.PI,0);ctx.lineTo(e.x+28,e.y+24);ctx.lineTo(e.x,e.y+24);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(e.x+7,e.y+8,5,7);ctx.fillRect(e.x+18,e.y+8,5,7);ctx.fillStyle='#222';ctx.fillRect(e.x+10,e.y+11,2,3);ctx.fillRect(e.x+20,e.y+11,2,3)}ctx.fillStyle='#444';ctx.fillRect(L-90,G-155,6,155);ctx.fillStyle='#19ae55';ctx.beginPath();ctx.moveTo(L-84,G-155);ctx.lineTo(L-25,G-130);ctx.lineTo(L-84,G-105);ctx.fill();if(inv===0||Math.floor(inv/6)%2===0){const p=player;ctx.fillStyle='#2563eb';ctx.fillRect(p.x+4,p.y+17,18,17);ctx.fillStyle='#ffbd88';ctx.fillRect(p.x+5,p.y+8,18,12);ctx.fillStyle='#db2424';ctx.fillRect(p.x+2,p.y+3,24,8);ctx.fillRect(p.x+9,p.y,14,6);ctx.fillStyle='#302015';ctx.fillRect(p.x+19,p.y+12,3,4);ctx.fillStyle='#684126';ctx.fillRect(p.x+1,p.y+31,11,4);ctx.fillRect(p.x+14,p.y+31,12,4)}ctx.restore()}
function frame(t){if(!active)return;if(!paused){step(last?Math.min((t-last)/16.67,2):1);draw()}last=t;if(active)raf=requestAnimationFrame(frame)}
document.getElementById('start').onclick=start;document.getElementById('pause').onclick=()=>{if(!active)return;paused=!paused;last=0;status.textContent=paused?'⏸ Pauza':'Gramy!'};const mapping={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'jump',KeyW:'jump',Space:'jump'};window.addEventListener('keydown',e=>{if(mapping[e.code]){e.preventDefault();keys[mapping[e.code]]=true}});window.addEventListener('keyup',e=>{if(mapping[e.code])keys[mapping[e.code]]=false});window.addEventListener('blur',()=>keys={});document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;b.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))});setup();draw();
</script></body></html>
